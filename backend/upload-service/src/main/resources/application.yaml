server:
  port: 8081

spring:
  application:
    name: upload-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/peculytics}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: peculytics
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

eureka:
  client:
    service-url:
      defaultZone: ${SPRING_EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
